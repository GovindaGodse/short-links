<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 300" width="576" height="300" role="img" aria-label="A long link shrinks into a short b1t.vercel.app link">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4f06a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c4f06a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5130"/>
      <stop offset="1" stop-color="#2a2c30"/>
    </linearGradient>
    <clipPath id="type"><rect x="80" y="130" height="40" width="0">
      <animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.06;0.34;1" values="0;0;440;440"/>
    </rect></clipPath>
  </defs>

  <rect width="576" height="300" fill="#0d0e10"/>
  <ellipse cx="288" cy="162" rx="256" ry="110" fill="url(#glow)"/>

  <g opacity="0" transform="translate(0 12)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.03;0.97;0.995;1" values="0;1;1;0;0"/>

    <!-- pill that physically shrinks -->
    <rect x="24" y="118" width="528" height="64" rx="32" fill="#141517" stroke="url(#edge)" stroke-width="1.5">
      <animate attributeName="x" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.44;0.60;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="24;24;140;140"/>
      <animate attributeName="width" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.44;0.60;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="528;528;296;296"/>
    </rect>

    <!-- link icon rides the left edge -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.44;0.60;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="0 0;0 0;116 0;116 0"/>
      <g transform="translate(46 140.5) scale(0.8)" fill="none" stroke="#c4f06a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 7h3a5 5 0 0 1 0 10h-3m-6 0H6A5 5 0 0 1 6 7h3M8 12h8"/>
      </g>
    </g>

    <!-- long URL: typed, then fades before the pill closes in -->
    <g>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.42;0.48;1" values="1;1;0;0"/>
      <g clip-path="url(#type)">
        <text x="80" y="155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14"><tspan fill="#f3f4f6">example.com</tspan><tspan fill="#8b8d92">/blog/how-to-grow-your-audience</tspan><tspan fill="#55575c">?ref=email</tspan></text>
      </g>
      <g>
        <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.34;0.35;1" values="1;1;0;0"/>
        <g>
          <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.06;0.34;1" values="0 0;0 0;437 0;437 0"/>
          <rect x="80" y="138" width="2" height="24" rx="1" fill="#c4f06a">
            <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- short URL -->
    <g opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.58;0.66;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.58;0.66;1" values="0 8;0 8;0 0;0 0"/>
      <text x="196" y="155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700"><tspan fill="#f3f4f6">b1t.vercel.app/</tspan><tspan fill="#c4f06a">482916</tspan></text>
    </g>

    <!-- success badge -->
    <circle cx="404" cy="150" r="13" fill="none" stroke="#c4f06a" stroke-width="1.5" opacity="0">
      <animate attributeName="r" dur="7s" repeatCount="indefinite" keyTimes="0;0.76;0.86;1" values="13;13;30;30"/>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.76;0.765;0.86;1" values="0;0;0.6;0;0"/>
    </circle>
    <g transform="translate(404 150)" opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.72;0.75;1" values="0;0;1;1"/>
      <g>
        <animateTransform attributeName="transform" type="scale" dur="7s" repeatCount="indefinite" keyTimes="0;0.72;0.77;0.80;1" values="0;0;1.2;1;1"/>
        <circle r="13" fill="#c4f06a" fill-opacity="0.12" stroke="#c4f06a" stroke-width="1.5"/>
        <path d="M-5 0.5 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#c4f06a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- character counter -->
    <text x="288" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6b6d72" opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.30;0.36;0.44;0.50;1" values="0;0;1;1;0;0"/>
      52 CHARACTERS
    </text>
    <text x="288" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#c4f06a" opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.74;0.81;1" values="0;0;1;1"/>
      21 CHARACTERS · 60% SHORTER
    </text>
  </g>

  <!-- note at the top (always visible) -->
  <g stroke="#c4f06a" stroke-width="1.6" stroke-linecap="round" transform="translate(-60 -196)">
    <path d="M186 255.5V268.5M179.5 262H192.5M181.4 257.4L190.6 266.6M190.6 257.4L181.4 266.6"/>
  </g>
  <text x="144" y="70" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#7c7e84">No account needed. Your link is ready in seconds.</text>
</svg>
